services:
  - type: web
    name: oiltrace-ai-backend
    env: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_MODE
        value: real
      - key: SIMULATION_SEED_ENABLED
        value: "true"
      - key: FRONTEND_URL
        value: https://oiltrace-ai-sentinel.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: oiltrace-db
          property: connectionString

databases:
  - name: oiltrace-db
    databaseName: oiltrace
    user: oiltrace_user
    plan: free
    region: singapore


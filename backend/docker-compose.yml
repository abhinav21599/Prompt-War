version: '3.8'

services:
  backend:
    build: .
    container_name: oiltrace-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_URL=sqlite:///./data/oiltrace.db
      - DEFAULT_DATA_MODE=simulation
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  db:
    image: postgis/postgis:15-3.3
    container_name: oiltrace-postgis
    environment:
      POSTGRES_DB: oiltrace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
